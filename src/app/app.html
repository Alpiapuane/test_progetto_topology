<!-- Icone riutilizzabili (PC, Switch, Router) referenziate con <use>; il colore arriva da currentColor -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="icon-pc" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
      <rect x="8" y="10" width="48" height="32" rx="3" /><rect x="13" y="15" width="38" height="22" fill="currentColor" opacity=".15" stroke="none" />
      <path d="M32 42v10M20 54h24" />
    </symbol>
    <symbol id="icon-switch" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
      <rect x="4" y="20" width="56" height="26" rx="3" />
      <path d="M12 34h4M22 34h4M32 34h4M42 34h4" /><circle cx="12" cy="27" r="1.5" fill="currentColor" /><circle cx="20" cy="27" r="1.5" fill="currentColor" />
      <path d="M14 46v6M32 46v6M50 46v6" />
    </symbol>
    <symbol id="icon-router" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
      <rect x="6" y="36" width="52" height="16" rx="3" /><path d="M16 36L10 14M48 36l6-22M32 36V20" />
      <circle cx="18" cy="44" r="1.8" fill="currentColor" /><circle cx="26" cy="44" r="1.8" fill="currentColor" />
      <path d="M24 12a11 11 0 0 1 16 0" />
    </symbol>
  </defs>
</svg>

<div class="page">
  <!-- Barra principale: selezione dispositivi e azioni sulla topologia. -->
  <header>
    <h1>Topologia di rete</h1>
    <app-palette />
    <div class="actions">
      <button (click)="topo.save()">Salva topologia</button>
      <button (click)="topo.load()">Carica topologia</button>
      <button (click)="topo.clearSaved()">Cancella topologia</button>
            <button (click)="exportJson()">Esporta JSON</button>
            <button (click)="jsonFile.click()">Importa JSON</button>
            <input #jsonFile class="file-input" type="file" accept=".json,application/json" aria-hidden="true" tabindex="-1"
              (change)="importJson($event)" />
      <button class="del" (click)="topo.deleteSelection()"
              [disabled]="!topo.selectedDeviceId() && !topo.selectedConnectionId()">Elimina selezione</button>
    </div>
  </header>
  <!-- Area di lavoro per aggiungere, spostare e collegare i dispositivi. -->
  <app-canvas />
</div>
<!-- I popup si mostrano quando il servizio contiene un ID di dettaglio. -->
<app-device-detail />
  <app-connection-detail />
<!-- Messaggio temporaneo di conferma o errore. -->
@if (topo.message(); as m) { <div class="toast" [class.err]="m.error">{{ m.text }}</div> }
